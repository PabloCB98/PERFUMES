<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Arkanoid</title>
        <link rel="icon" type="image/png" href="imagenes/varios/icono/arcade-machine.png"> <!-- meterle foto en la pestaña de la web -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Press+Start+2P&display=swap" rel="stylesheet">
        <style>
            body{
                margin: 0;
                padding: 0;
                overflow: hidden;height: 100vh;
                background-image: url(/imagenes/varios/fondos/arcadeFondoFinal.png);
                background-size: 110%;
                background-position: center;

            }
            *{
                padding: 0;
                margin: 0;
            }
            canvas{
                margin-top: 30px;
                display: block;
                margin-left: auto;
                margin-right: auto;
            }
            
            #contenedor-arcade {
                position: relative; 
                width: 700px;
                height: 1050px;
                margin: 0 auto; 
                background-image: url('/imagenes/varios/fondos/arkanoidCopia2.jpg');
                background-size: cover;
                background-position: center;
                box-shadow: 0 15px 35px rgba(0,0,0,0.5);

                transform: scale(1.1);
                transform-origin: top center;
                margin-top: 0;
        

            }
            
            #miCanvas {
            position: absolute;
            /* Va de un blanco roto arriba a un beige muy sutil abajo */
            background: linear-gradient(180deg, #FFFFFF 0%, #F5F0E6 100%);
            border: 2px solid #D4AF37;
            border-radius: 12px;
            box-shadow: 0 0px 25px rgba(255,255,200,0.15);

            top: 22%;
            left: 14%;

            width: 70%;
            height: 42%;

            background-color: transparent;
}
    .boton-salir-arcade {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 10000;
    font-family: 'Press Start 2P', cursive;
    font-size: 12px;
    color: #D4AF37; 
    text-decoration: none;
    padding: 15px 20px;
    background: rgba(0, 0, 0, 0.7);
    border: 2px solid #D4AF37;
    border-radius: 5px;
    transition: all 0.3s ease;
}

.boton-salir-arcade:hover {
    background: #D4AF37;
    color: black;
    transform: scale(1.1);
    box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
}
        </style>
    </head>
    <body>
        <div id = "contenedor-arcade">
        <canvas id="miCanvas" width="900" height="550"></canvas>
        </div>

        <a href="despedida.html" class="boton-salir-arcade">
        &larr; SALIR DE LA MÁQUINA
</a>
    </body>
    <script src="js/script-arkanoid.js"></script>

</html>
